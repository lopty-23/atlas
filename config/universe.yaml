# Universe definition for the atlas macro quant project.
# Defines which ETFs to trade and which FRED series to use as macro signals.
#
# Notes on date ranges:
# - `start` is the earliest reliable inception date for each ETF
# - Backtests will use max(all starts) as effective start date, OR you can
#   allow assets to enter the panel as they become available (preferred)
#
# Notes on FRED lag_days:
# - This is the typical publication lag in business days for each series
# - CPI: ~14 business days (released mid-month for the prior month)
# - Daily series (yields, VIX, FX): 1 business day to be safe
# - Quarterly GDP: ~25 business days for first release
# - These are conservative estimates; for production use ALFRED vintages

etfs:
  us_equity:
    - {ticker: SPY,  name: "S&P 500",                start: "1993-02-01"}
    - {ticker: IWM,  name: "Russell 2000",           start: "2000-05-26"}
  intl_equity:
    - {ticker: EFA,  name: "MSCI EAFE",              start: "2001-08-27"}
    - {ticker: EEM,  name: "MSCI Emerging Markets",  start: "2003-04-14"}
  us_bonds:
    - {ticker: IEF,  name: "7-10y Treasuries",       start: "2002-07-30"}
    - {ticker: TLT,  name: "20y+ Treasuries",        start: "2002-07-30"}
    - {ticker: LQD,  name: "Investment-grade credit", start: "2002-07-30"}
    - {ticker: HYG,  name: "High-yield credit",      start: "2007-04-11"}
  intl_bonds:
    - {ticker: BWX,  name: "Intl sovereigns ex-US",  start: "2007-10-05"}
    - {ticker: EMB,  name: "EM sovereigns USD",      start: "2007-12-19"}
  commodities:
    - {ticker: GLD,  name: "Gold",                   start: "2004-11-18"}
    - {ticker: SLV,  name: "Silver",                 start: "2006-04-28"}
    - {ticker: DBC,  name: "Broad commodities",      start: "2006-02-03"}
    - {ticker: USO,  name: "WTI crude oil",          start: "2006-04-10"}
    - {ticker: BNO,  name: "Brent crude oil",        start: "2010-06-02"}
  fx:
    - {ticker: UUP,  name: "USD index",              start: "2007-02-20"}
    - {ticker: FXE,  name: "EUR",                    start: "2005-12-09"}
    - {ticker: FXY,  name: "JPY",                    start: "2007-02-12"}
    - {ticker: FXA,  name: "AUD",                    start: "2006-06-26"}
  real_assets:
    - {ticker: VNQ,  name: "US REITs",               start: "2004-09-23"}
    - {ticker: RWX,  name: "Intl REITs ex-US",       start: "2006-12-19"}

fred_series:
  rates:
    - {id: DGS10,    name: "10y Treasury yield",      lag_days: 1}
    - {id: DGS2,     name: "2y Treasury yield",       lag_days: 1}
    - {id: DGS3MO,   name: "3m T-bill yield",         lag_days: 1}
    - {id: T10Y3M,   name: "10y-3m spread",           lag_days: 1}
    - {id: T10Y2Y,   name: "10y-2y spread",           lag_days: 1}
    - {id: DFF,      name: "Effective Fed Funds",     lag_days: 1}
  inflation:
    - {id: CPIAUCSL, name: "Headline CPI",            lag_days: 14}
    - {id: CPILFESL, name: "Core CPI",                lag_days: 14}
    - {id: PCEPI,    name: "PCE deflator",            lag_days: 25}
    - {id: T5YIE,    name: "5y breakeven inflation",  lag_days: 1}
  activity:
    - {id: INDPRO,   name: "Industrial Production",   lag_days: 14}
    - {id: PAYEMS,   name: "Nonfarm Payrolls",        lag_days: 5}
    - {id: UNRATE,   name: "Unemployment rate",       lag_days: 5}
    - {id: GDPC1,    name: "Real GDP",                lag_days: 25}
  financial:
    - {id: BAA10Y,   name: "BAA-10y credit spread",   lag_days: 1}
    - {id: NFCI,     name: "NFCI",                    lag_days: 7}
    - {id: VIXCLS,   name: "VIX",                     lag_days: 1}
    - {id: DTWEXBGS, name: "Trade-weighted USD",      lag_days: 1}

# Settings used by the data layer
settings:
  cache_dir: "data"
  start_date: "2003-01-01"   # earliest we'll fetch anything
  end_date: null              # null means "up to today"
  business_day_calendar: "US" # could be "NYSE" later