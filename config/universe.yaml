# Universe definition for the atlas macro quant project.
# Defines which ETFs to trade and which FRED series to use as macro signals.
#
# Notes on date ranges:
# - `start` is the earliest reliable inception date for each ETF
# - Backtests will use max(all starts) as effective start date, OR you can
#   allow assets to enter the panel as they become available (preferred)
#
# Notes on FRED lag_days (verified May 2026):
# - Lag is in business days from REFERENCE date to date the value is safely
#   known by close-of-business for trading decisions.
# - Daily H.15 series (DGS10, DGS2, DGS3MO, DFF, T10Y3M, T10Y2Y, T5YIE, BAA10Y):
#   H.15 posts at 4:15pm ET, same business day. Lag=1 reflects "known by next
#   close" — safe for daily strategies that trade next-day or next-open.
# - VIXCLS, DTWEXBGS: FRED updates next morning. Lag=1.
# - NFCI: published Wednesday 8:30am ET covering through prior Friday.
#   Friday's value is known by Wednesday's close, so lag=3 business days.
# - Vintage-aware series (CPI, PCE, GDP, NFP, IP, UNRATE): use ALFRED real
#   publication dates from `align_vintages_to_calendar` — lag_days here is
#   only a fallback if ALFRED data is missing for that series.

etfs:
  us_equity:
    - {ticker: SPY,  name: "S&P 500",                start: "1993-02-01"}
    - {ticker: IWM,  name: "Russell 2000",           start: "2000-05-26"}
  intl_equity:
    - {ticker: EFA,  name: "MSCI EAFE",              start: "2001-08-27"}
    - {ticker: EEM,  name: "MSCI Emerging Markets",  start: "2003-04-14"}
  us_bonds:
    - {ticker: IEF,  name: "7-10y Treasuries",       start: "2002-07-30"}
    - {ticker: TLT,  name: "20y+ Treasuries",        start: "2002-07-30"}
    - {ticker: LQD,  name: "Investment-grade credit", start: "2002-07-30"}
    - {ticker: HYG,  name: "High-yield credit",      start: "2007-04-11"}
  intl_bonds:
    - {ticker: BWX,  name: "Intl sovereigns ex-US",  start: "2007-10-05"}
    - {ticker: EMB,  name: "EM sovereigns USD",      start: "2007-12-19"}
  commodities:
    - {ticker: GLD,  name: "Gold",                   start: "2004-11-18"}
    - {ticker: SLV,  name: "Silver",                 start: "2006-04-28"}
    - {ticker: DBC,  name: "Broad commodities",      start: "2006-02-03"}
    - {ticker: USO,  name: "WTI crude oil",          start: "2006-04-10"}
    - {ticker: BNO,  name: "Brent crude oil",        start: "2010-06-02"}
  fx:
    - {ticker: UUP,  name: "USD index",              start: "2007-02-20"}
    - {ticker: FXE,  name: "EUR",                    start: "2005-12-09"}
    - {ticker: FXY,  name: "JPY",                    start: "2007-02-12"}
    - {ticker: FXA,  name: "AUD",                    start: "2006-06-26"}
  real_assets:
    - {ticker: VNQ,  name: "US REITs",               start: "2004-09-23"}
    - {ticker: RWX,  name: "Intl REITs ex-US",       start: "2006-12-19"}

fred_series:
  rates:
    - {id: DGS10,    name: "10y Treasury yield",      lag_days: 1}
    - {id: DGS2,     name: "2y Treasury yield",       lag_days: 1}
    - {id: DGS3MO,   name: "3m T-bill yield",         lag_days: 1}
    - {id: DGS30,    name: "30y Treasury yield",      lag_days: 1}
    - {id: T10Y3M,   name: "10y-3m spread",           lag_days: 1}
    - {id: T10Y2Y,   name: "10y-2y spread",           lag_days: 1}
    - {id: DFF,      name: "Effective Fed Funds",     lag_days: 1}
    - {id: IR3TIB01EZM156N, name: "EUR 3m interbank",  lag_days: 33}
    - {id: IR3TIB01JPM156N, name: "JPY 3m interbank",  lag_days: 33}
    - {id: IR3TIB01GBM156N, name: "GBP 3m interbank",  lag_days: 33}
    - {id: IR3TIB01AUM156N, name: "AUD 3m interbank",  lag_days: 33}  
  inflation:
    - {id: CPIAUCSL, name: "Headline CPI",            lag_days: 14, vintage: true}
    - {id: CPILFESL, name: "Core CPI",                lag_days: 14, vintage: true}
    - {id: PCEPI,    name: "PCE deflator",            lag_days: 25, vintage: true}
    - {id: T5YIE,    name: "5y breakeven inflation",  lag_days: 1}
  activity:
    - {id: INDPRO,   name: "Industrial Production",   lag_days: 14, vintage: true}
    - {id: PAYEMS,   name: "Nonfarm Payrolls",        lag_days: 5,  vintage: true}
    - {id: UNRATE,   name: "Unemployment rate",       lag_days: 5,  vintage: true}
    - {id: GDPC1,    name: "Real GDP",                lag_days: 25, vintage: true}
  financial:
    - {id: BAA10Y,   name: "BAA-10y credit spread",   lag_days: 1}
    - {id: NFCI,     name: "NFCI",                    lag_days: 5}
    - {id: VIXCLS,   name: "VIX",                     lag_days: 1}
    - {id: DTWEXBGS, name: "Trade-weighted USD",      lag_days: 1}

# Settings used by the data layer
settings:
  cache_dir: "data"
  start_date: "2003-01-01"   # earliest we'll fetch anything
  end_date: null              # null means "up to today"
  business_day_calendar: "US" # could be "NYSE" later

# Risk buckets for portfolio risk limits (risk.py). Regrouped from the `etfs`
# classes by RISK DRIVER rather than issuer label: LQD and EMB sit in `credit`
# (spread-driven) not `rates`, since their risk is credit not pure duration;
# BWX stays in `rates` (developed sovereign duration). Caps key off these.
risk_buckets:
  equity:      [SPY, IWM, EFA, EEM]
  rates:       [IEF, TLT, BWX]
  credit:      [LQD, HYG, EMB]
  commodities: [GLD, SLV, DBC, USO, BNO]
  fx:          [UUP, FXE, FXY, FXA]
  real_assets: [VNQ, RWX]

# Risk limits applied by risk.py to sizing's gross-unconstrained weights.
# LITERATURE-ANCHORED PRIORS, not fitted — sensitivity-check in the backtest.
# - max_position: per-asset cap (backstop vs single-name domination)
# - max_bucket:   per-risk-bucket cap, uniform (no bucket owns the book)
# - max_gross:    gross leverage cap (tail backstop above typical ~2.6x gross,
#                 below the dangerous 4-6x low-vol-estimate excursions)
# All fractions are of GROSS exposure (sum|w|); see risk.py for the long-short
# gross-vs-net definitional choice.
risk_limits:
  max_position: 0.20
  max_bucket:   0.50
  max_gross:    3.0